<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Romántica</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: url('./img/2.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    #login, #carta {
      background: rgba(223, 130, 200, 0.95);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      text-align: center;
      width: 90%;
      max-width: 450px;
      box-sizing: border-box;
    }
    h2 {
      color: #f7e0e8;
      margin-top: 0;
    }
    h5 {
      color: #c9235d;
      margin-top: 0;
    }
    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .teclado button {
      padding: 15px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background: #ffb3c6;
      color: #4a1525bd;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .teclado button:active {
      transform: scale(0.95);
    }
    .teclado button:hover {
      background: #ff8fa3;
    }
    input[type="password"] {
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 2px solid #ffb3c6;
      text-align: center;
      font-size: 24px;
      letter-spacing: 5px;
      width: 80%;
      outline: none;
    }
    .boton {
      padding: 12px 24px;
      border: none;
      background: #c97b9686;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .boton:hover {
      background: #a61e4d;
    }
    /* Estilos del carrusel */
    .carousel {
      position: relative;
      width: 100%;
      height: 140%;
      margin: 20px 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }
    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }
    .slides img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .carousel button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 12px 16px;
      font-size: 18px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s;
    }
    .carousel button:hover {
      background: rgba(214, 51, 108, 0.8);
    }
    .prev { left: 10px; }
    .next { right: 10px; }
    
    #poesiaBox {
      background: rgba(255, 240, 245, 0.95);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #poesia {
      font-style: italic;
      color: #6a1b4d;
      font-size: 17px;
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Audio de fondo -->
  <audio id="musica" src="./amor.mp3" preload="auto"></audio>
  
  <!-- Pantalla de Login -->
  <div id="login">
    <h2>Introduce la contraseña</h2>
    <h5>La contraseña es el mes y dia que nos volvimos novios 💘❤</h5>
    <input type="password" id="password" placeholder="••••" readonly>
    <div class="teclado">
      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button onclick="borrar()">←</button>
      <button onclick="agregar('0')">0</button>
      <button onclick="verificar()">✔</button>
    </div>
  </div>

  <!-- Pantalla de la Carta -->
  <div id="carta" style="display: none;">
    <h2>💌 Mi Princess Kitty 💌</h2>

    <div class="carousel">
      <div class="slides" id="slides">
        <img src="./img/9.jpg" alt="Pareja feliz" width="50%" height="50%">
        <img src="./img/6.jpg" alt="Atardecer romántico">
        <img src="./img/4.jpg" alt="Flores">
      </div>
      <button class="prev" onclick="mover(-1)">❮</button>
      <button class="next" onclick="mover(1)">❯</button>
    </div>

    <div id="poesiaBox">
      <p id="poesia"></p>
    </div>

    <button class="boton" onclick="regresar()">Regresar</button>
  </div>

  <script>
    const audio = document.getElementById("musica");

    function agregar(num) {
      document.getElementById("password").value += num;
    }

    function borrar() {
      const campo = document.getElementById("password");
      campo.value = campo.value.slice(0, -1);
    }

    function verificar() {
      const clave = document.getElementById("password").value;
      if (clave === "1027") {
        document.getElementById("login").style.display = "none";
        document.getElementById("carta").style.display = "block";
        audio.play().catch(() => {
          // Si el navegador bloquea la reproducción automática, no arroja error fatal
        });
      } else {
        alert("Contraseña incorrecta. Intenta de nuevo.");
        document.getElementById("password").value = "";
      }
    }

    function regresar() {
      document.getElementById("carta").style.display = "none";
      document.getElementById("login").style.display = "block";
      document.getElementById("password").value = "";
      audio.pause();
      audio.currentTime = 0;
    }

    // Carrusel y frases sincronizadas
    const versos = [
      `"Tus manos son mi caricia,<br>mis acordes cotidianos." — Mario Benedetti`,
      `"Te quiero en mi paraíso,<br>es decir que en mi país." — Mario Benedetti`,
      `"Tu boca que es tuya y mía,<br>tu boca no se equivoca." — Mario Benedetti`
    ];

    let index = 0;
    document.getElementById("poesia").innerHTML = versos[index];

    function mover(n) {
      const slides = document.getElementById("slides");
      const total = slides.children.length;
      index = (index + n + total) % total;
      slides.style.transform = `translateX(-${index * 100}%)`;
      document.getElementById("poesia").innerHTML = versos[index];
    }
  </script>
</body>
</html>
